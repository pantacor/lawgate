name: Website

# Builds the Hugo site in site/ and publishes it to GitHub Pages.
# Pull requests only build it, to catch template or link errors before merge.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
    paths: ['site/**', 'docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: '0.168.0'

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Hugo
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSL "${base}/hugo_${HUGO_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "${tarball}" hugo
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build
        working-directory: site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url || 'https://pantacor.github.io/lawgate' }}
        run: |
          echo "Building for ${BASE_URL}/"
          hugo --gc --minify --panicOnWarning --baseURL "${BASE_URL}/"

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
