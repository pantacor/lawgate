baseURL = "https://pantacor.github.io/lawgate/"
title = "lawgate"
disableKinds = ["taxonomy", "term", "RSS"]
enableGitInfo = false

[params]
  description = "The laws-and-proofs gate from Pantacor. People write the laws of a repository in LAWS.md, and one command, lawgate check, refuses a change that breaks one."
  # The release shown in the install command. Keep it equal to the version the
  # CI templates pin (templates/github-actions.yml, templates/gitlab-ci.yml).
  version = "v0.1.1"
  repo = "https://github.com/pantacor/lawgate"
  module = "github.com/pantacor/lawgate"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  style = "github"

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

# The guides live in ../docs, so the site renders them in place instead of
# keeping copies.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../docs"
    target = "content/docs"
    files = ["USER_GUIDE.md", "CONCEPTS.md", "DEVELOPER_GUIDE.md", "TROUBLESHOOTING.md"]
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
